name: BookCatalog
options:
  bundleIdPrefix: com.bormilan
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    OPEN_LIBRARY_USER_AGENT: "BookCatalog/0.0.1 (contact: maintainer@example.com)"
targets:
  BookCatalog:
    type: application
    platform: iOS
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    sources:
      - path: BookCatalog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bormilan.bookcatalog
        MARKETING_VERSION: 0.0.2
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Book Catalog
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Book Catalog uses the camera to scan ISBN barcodes."
        INFOPLIST_KEY_OpenLibraryUserAgent: "$(OPEN_LIBRARY_USER_AGENT)"
    scheme:
      testTargets:
        - BookCatalogTests
  BookCatalogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BookCatalogTests
    dependencies:
      - target: BookCatalog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bormilan.bookcatalog.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BookCatalog.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BookCatalog"
        BUNDLE_LOADER: "$(TEST_HOST)"
